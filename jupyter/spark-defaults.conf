# Spark configuration for the group 13 stack.
#
# These settings are applied at JVM launch by spark-submit, which PySpark
# invokes when a SparkSession is created. Keeping them here rather than in
# notebook code means every session gets the same JVM, and a setting cannot
# silently fail to apply because a kernel was already running.

# The base image sets SPARK_OPTS with -Xmx4096M, but nothing applies that
# variable to the python3 kernel, so the driver would start at Spark's 1 GB
# default. In local mode the driver is also the executor, and decoding the
# register collection from BSON exhausted that heap.
# driver would start at Spark's 1 GB default. In local mode the driver is also the executor. Keep this below the container's memory limit so the JVM has room for native memory, PySpark, and the Mongo connector while decoding BSON.
spark.driver.memory                 6g

# Fixed thread count. local[*] gave one task per core (12 on this host), each
# holding its own MongoDB cursor batch in the same heap.
spark.master                        local[4]

# MongoDB Spark Connector. Resolved from Maven Central on first use and cached
# in ~/.ivy2 inside the container.
spark.jars.packages                 org.mongodb.spark:mongo-spark-connector_2.13:11.1.0

# "mongodb" is the docker-compose service name, reachable from this container.
spark.mongodb.read.connection.uri   mongodb://mongodb:27017
spark.mongodb.write.connection.uri  mongodb://mongodb:27017

# Fixed timezone so timestamp handling does not depend on the host locale.
spark.sql.session.timeZone          UTC
